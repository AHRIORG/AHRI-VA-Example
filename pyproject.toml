[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ahri-va"
version = "0.2.0"
description = "Validate inputs for the adult InterVA5 replication benchmark"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ahri-va = "ahri_va.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ahri_va = ["predictors.json"]
