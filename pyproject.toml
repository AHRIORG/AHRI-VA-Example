[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ahri-va"
version = "0.3.0"
description = "Validate and baseline the adult InterVA5 replication benchmark"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "scikit-learn==1.8.0", "numpy==2.4.3", "scipy==1.17.1",
    "joblib==1.5.3", "threadpoolctl==3.6.0",
]

[project.optional-dependencies]
dev = ["mypy==1.19.1"]

[project.scripts]
ahri-va = "ahri_va.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ahri_va = ["predictors.json"]

[tool.mypy]
files = ["src"]
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true
